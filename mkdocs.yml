site_name: Edgar Vela | Hardware & Electronics Engineer
site_url: https://edgar-vela.ch
site_author: Edgar Marcelo Vela Pinela
site_description: Professional portfolio of Edgar Vela - Hardware & Electronics Engineer based in Zürich, Switzerland. Specializing in PCR biomedical devices, embedded systems, PCB design, and DSP.

theme:
  name: material
  language: en
  palette:
    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  font:
    text: Inter
    code: JetBrains Mono
  icon:
    logo: material/chip
  features:
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.instant
    - navigation.tracking
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/emvela29
      name: GitHub
    - icon: fontawesome/brands/linkedin
      link: https://www.linkedin.com/in/emvela/
      name: LinkedIn
    - icon: fontawesome/solid/envelope
      link: mailto:contact@edgar-vela.ch
      name: Email

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables

plugins:
  - search
  - minify:
      minify_html: true

nav:
  - Home: index.md
  - Projects: projects.md
  - Experience: experience.md
  - Publications: publications.md
  - Contact: contact.md
